# JPA / schema
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=true

# Server. Platforms that inject a PORT variable (Render, Railway, etc.) override the default.
server.port=${PORT:8080}

# Datasource. Username/password must be supplied via the environment; the URL keeps a
# local default so `mvn spring-boot:run` works without exported variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/contact_management_db}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JWT signing secret (>= 32 bytes for HS256). Must be supplied via the environment.
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Browser origin of the deployed frontend that is allowed to call this API.
# The Vite dev server runs over HTTPS (see frontend/vite.config.js), so the
# default matches https. Override with CORS_ORIGIN in other environments.
app.cors.allowed-origin=${CORS_ORIGIN:https://localhost:5173}
