spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/contact_management}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JWT signing secret (>= 32 bytes for HS256). Override via JWT_SECRET env in production.
jwt.secret=${JWT_SECRET:dev-only-change-me-in-prod-0123456789abcdef0123456789abcdef}
jwt.expiration=86400000
