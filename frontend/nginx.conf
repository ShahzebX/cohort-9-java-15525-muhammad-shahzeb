server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Client-side routing (react-router): serve index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Fingerprinted build assets can be cached aggressively.
    location ~* \.(?:js|css|png|jpe?g|gif|svg|ico|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must always be revalidated so new deploys are picked up.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
